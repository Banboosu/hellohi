<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>摇摆生姜生成器</title>
        <link rel="icon" type="image/png" href="icon.png" />
        <link rel="stylesheet" href="style.css" />
        <style>
            @font-face {
                font-family: "Source Han Sans SC";
                src:
                    local("Source Han Sans SC Medium"),
                    local("Source Han Sans Medium");
                font-weight: 500;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>摇摆生姜生成器</h1>
            </header>

            <main>
                <div class="card">
                    <div class="preview-area">
                        <canvas id="canvas" width="720" height="720"></canvas>
                    </div>

                    <div class="controls controls-top">
                        <div class="upload-box action-item">
                            <label for="fileInput" class="btn btn-block"
                                >选择图片</label
                            >
                            <input
                                type="file"
                                id="fileInput"
                                accept="image/*"
                                style="display: none"
                            />
                        </div>
                        <button
                            id="toggleAdjust"
                            class="btn btn-block action-item"
                        >
                            调整模式: 关
                        </button>
                        <button
                            id="generateBtn"
                            class="btn btn-block action-item"
                        >
                            生成 GIF
                        </button>
                    </div>

                    <div class="control-panel">
                        <div class="control-group">
                            <label for="scaleRange">缩放</label>
                            <input
                                type="range"
                                id="scaleRange"
                                min="10"
                                max="300"
                                value="100"
                            />
                        </div>
                        <div class="control-group">
                            <label for="textXRange">文字 X</label>
                            <input
                                type="range"
                                id="textXRange"
                                min="0"
                                max="720"
                                value="279"
                            />
                        </div>
                        <div class="control-group">
                            <label for="textYRange">文字 Y</label>
                            <input
                                type="range"
                                id="textYRange"
                                min="0"
                                max="720"
                                value="184"
                            />
                        </div>
                        <div class="control-group">
                            <label for="textEnabledSelect">动画文字</label>
                            <select id="textEnabledSelect">
                                <option value="on" selected>开</option>
                                <option value="off">关</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="textColorSelect">文字颜色</label>
                            <select id="textColorSelect">
                                <option value="#000000" selected>黑</option>
                                <option value="#ffffff">白</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="resultCard" class="card" style="display: none">
                    <h2>生成结果</h2>
                    <div class="result-area">
                        <img id="resultImage" alt="Generated Result" />
                    </div>
                    <div class="controls result-controls">
                        <a
                            id="downloadBtn"
                            class="btn btn-block"
                            download="generated.gif"
                            >下载文件</a
                        >
                        <!--<a
                            href="https://docsmall.com/gif-compress"
                            target="_blank"
                            class="result-link"
                            >建议到这里压缩一下</a
                        >-->
                    </div>
                </div>
            </main>
        </div>

        <script src="coi-serviceworker.min.js"></script>
        <script src="ffmpeg.min.js"></script>
        <script src="ffmpeg-util.js"></script>
        <script src="main.js"></script>
    </body>
</html>
