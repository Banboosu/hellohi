<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GIF Generator</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            /* 预载入字体（如果本地有的话） */
            @font-face {
                font-family: "Source Han Sans SC";
                src:
                    local("Source Han Sans SC Medium"),
                    local("Source Han Sans Medium");
                font-weight: 500;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>摇摆生姜生成器</h1>
            </header>

            <main>
                <!--<div
                    class="tip"
                    style="margin-bottom: 1rem; font-size: 0.9rem; color: #666"
                >
                    提示：如果无法生成 GIF，请使用本地服务器运行。
                </div>-->
                <div class="card">
                    <div class="preview-area">
                        <canvas id="canvas" width="720" height="720"></canvas>
                    </div>
                    <div class="controls">
                        <div class="upload-box">
                            <label for="fileInput" class="btn">选择图片</label>
                            <input
                                type="file"
                                id="fileInput"
                                accept="image/*"
                                style="display: none"
                            />
                        </div>
                        <button id="toggleAdjust" class="btn">
                            调整模式: 关
                        </button>
                        <div
                            class="control-group"
                            style="
                                display: flex;
                                align-items: center;
                                gap: 0.5rem;
                                margin: 0 1rem;
                            "
                        >
                            <label for="scaleRange">缩放:</label>
                            <input
                                type="range"
                                id="scaleRange"
                                min="10"
                                max="300"
                                value="100"
                            />
                        </div>
                        <div
                            class="control-group"
                            style="
                                display: flex;
                                align-items: center;
                                gap: 0.5rem;
                                margin: 0 1rem;
                            "
                        >
                            <label>文字 X:</label>
                            <input
                                type="range"
                                id="textXRange"
                                min="0"
                                max="720"
                                value="279"
                            />
                            <label>文字 Y:</label>
                            <input
                                type="range"
                                id="textYRange"
                                min="0"
                                max="720"
                                value="184"
                            />
                        </div>
                        <button id="generateBtn" class="btn">生成 GIF</button>
                        <button id="generateWebpBtn" class="btn">
                            生成 WebP
                        </button>
                    </div>
                </div>

                <div id="resultCard" class="card" style="display: none">
                    <h2>生成结果</h2>
                    <div class="result-area">
                        <img id="resultImage" alt="Generated Result" />
                    </div>
                    <div class="controls">
                        <a id="downloadBtn" class="btn" download="generated.gif"
                            >下载文件</a
                        >
                        <a
                            href="https://docsmall.com/gif-compress"
                            target="_blank"
                            style="margin-left: 12px; font-size: 20px"
                            >建议自行压缩一下</a
                        >
                    </div>
                </div>
            </main>
        </div>

        <!-- 必须本地引用以确保 Service Worker 作用域正确 -->
        <script src="coi-serviceworker.min.js"></script>

        <script src="ffmpeg.min.js"></script>
        <script src="ffmpeg-util.js"></script>
        <script src="main.js"></script>
    </body>
</html>
