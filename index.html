<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>生姜点头生成器</title>
        <link rel="icon" type="image/png" href="icon.png" />
        <link rel="stylesheet" href="style.css" />
        <style>
            @font-face {
                font-family: "Source Han Sans SC";
                src:
                    local("Source Han Sans SC Medium"),
                    local("Source Han Sans Medium");
                font-weight: 500;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>摇摆生姜生成器</h1>
            </header>

            <main>
                <div class="card">
                    <div class="preview-area">
                        <canvas id="canvas" width="720" height="720"></canvas>
                    </div>

                    <div class="controls controls-top primary-actions">
                        <div class="upload-box action-item upload-action">
                            <label for="fileInput" class="btn btn-block"
                                >选择图片</label
                            >
                            <input
                                type="file"
                                id="fileInput"
                                accept="image/*"
                                style="display: none"
                            />
                        </div>
                        <div class="adjust-stack action-item">
                            <div class="adjust-actions">
                                <button
                                    id="toggleAdjust"
                                    class="btn btn-block adjust-toggle"
                                >
                                    调整模式：关
                                </button>
                                <button
                                    id="resetAdjustments"
                                    class="btn adjust-reset"
                                    type="button"
                                >
                                    复位
                                </button>
                            </div>
                            <div
                                class="control-group adjust-slider-group adjust-slider-inline"
                                id="scaleControlGroup"
                            >
                                <label for="scaleRange">缩放</label>
                                <input
                                    type="range"
                                    id="scaleRange"
                                    min="10"
                                    max="300"
                                    value="100"
                                />
                            </div>
                        </div>
                        <button
                            id="generateBtn"
                            class="btn btn-block action-item"
                        >
                            生成 GIF
                        </button>
                    </div>

                    <div class="control-panel" id="controlPanel">
                        <div class="control-group control-group-inline text-toggle-group">
                            <label for="toggleTextEnabled">动画文字</label>
                            <button id="toggleTextEnabled" class="btn btn-inline">
                                开
                            </button>
                        </div>
                        <div class="control-group control-group-inline text-toggle-group">
                            <label for="toggleTextColor">文字颜色</label>
                            <button id="toggleTextColor" class="btn btn-inline">
                                黑
                            </button>
                        </div>
                    </div>
                </div>

                <div id="resultCard" class="card" style="display: none">
                    <h2>生成结果</h2>
                    <div class="result-area">
                        <img id="resultImage" alt="Generated Result" />
                    </div>
                    <div class="controls result-controls">
                        <a
                            id="downloadBtn"
                            class="btn btn-block"
                            download="generated.gif"
                            >下载文件</a
                        >
                    </div>
                </div>
            </main>
        </div>

        <script src="coi-serviceworker.min.js"></script>
        <script src="ffmpeg.min.js"></script>
        <script src="ffmpeg-util.js"></script>
        <script src="main.js"></script>
    </body>
</html>
